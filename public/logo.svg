<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Document Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="34" y1="26" x2="94" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="72" y1="26" x2="94" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="14" y1="64" x2="114" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.95" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with Galaxy Gradient -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="36" cy="36" r="30" fill="#38BDF8" opacity="0.3" filter="blur(8px)" />
  <circle cx="96" cy="96" r="28" fill="#F43F5E" opacity="0.25" filter="blur(10px)" />

  <!-- Galaxy Orbital Ring Behind Document -->
  <ellipse cx="64" cy="66" rx="46" ry="17" stroke="url(#orbitGrad)" stroke-width="4.5" transform="rotate(-24 64 66)" opacity="0.75" />

  <!-- Main Document Page (Shadowed) -->
  <g filter="url(#softShadow)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M40 30 C37 30 35 32 35 35 L35 93 C35 96 37 98 40 98 L88 98 C91 98 93 96 93 93 L93 50 L73 30 Z" fill="url(#sheetGrad)" />
    <!-- Folded Corner Flap -->
    <path d="M73 30 L73 48 C73 50 75 52 77 52 L93 50 Z" fill="url(#foldGrad)" opacity="0.85" />
  </g>

  <!-- PDF Accent Stripes on Sheet -->
  <rect x="44" y="58" width="40" height="4.5" rx="2.25" fill="#3B82F6" />
  <rect x="44" y="68" width="32" height="4" rx="2" fill="#818CF8" />
  <rect x="44" y="78" width="24" height="4" rx="2" fill="#CBD5E1" />

  <!-- Red Accent Badge "PDF" -->
  <rect x="42" y="42" width="24" height="10" rx="3" fill="#EF4444" />
  <text x="54" y="49.5" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="6.5" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">PDF</text>

  <!-- Galaxy Orbital Ring In Front of Document -->
  <path d="M22 80 C 40 92, 86 86, 106 52" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#innerGlow)" />

  <!-- Orbiting Planets / Stars -->
  <!-- Star Sparkle 1 -->
  <g transform="translate(104, 48)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#FDE047" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Planet Orb 1 -->
  <circle cx="24" cy="80" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Small Glimmer Stars -->
  <circle cx="26" cy="38" r="2" fill="#FFFFFF" opacity="0.85" />
  <circle cx="98" cy="88" r="2" fill="#FFFFFF" opacity="0.75" />
</svg>
